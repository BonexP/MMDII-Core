[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdii-core"
version = "0.3.0"
description = "Reusable code for MMDII multimodal welding-fault research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MMDII Team" }]
dependencies = ["scipy>=1.11", "PyWavelets>=1.6"]

[project.optional-dependencies]
dev = []
train = ["torch==2.5.1", "scikit-learn>=1.4"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
