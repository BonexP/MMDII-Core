[experiment]
release_directory = "../../../data/interim/releases/weld-independent-v0-2-1-r2"
output_directory = "outputs/time-frequency-v0-3-1-pure-deep"
target_codes = ["flash", "blur", "tunnel"]
mode = "window_mil"
aggregator = "mean"
seed = 7
fold_count = 5
fold_scheme = "weld_independent"
epochs = 20
batch_size = 4
learning_rate = 0.001
weight_decay = 0.0001
optimizer = "adamw"
early_stopping_patience = 0
early_stopping_min_delta = 0.0
gradient_clip_norm = 0.0
device = "auto"
pipeline_backend = "cuda"
target_fs = 5400.0
window_seconds = 2.0
stride_seconds = 1.0
full_signal_samples = 4096

[model]
hidden_channels = 32
embedding_dim = 64
kernel_size = 31
block_count = 2
dropout = 0.1
top_k = 3
attention_dim = 64
encoder_chunk_size = 32

[representation]
name = "dwt_swt_db4"
encoder = "resnet2d_small"
fusion = "raw_plus_dwt"
output_time_bins = 256
normalization = "per_channel_zscore"
dwt_wavelet = "db4"
dwt_level = 5

[matrix]
version = "v0.3.1"
purpose = "pure_deep"
representations = ["dwt_swt_db4"]
feature_fusions = ["raw_plus_dwt"]
encoders = [
  "resnet2d_small",
  "resnet2d_wide",
  "resnet2d_separable",
  "convnext2d_lite",
  "convnext2d_deep",
]
aggregators = ["mean"]
seeds = [7, 17, 27]
fold_scheme = "weld_independent"
fold_count = 5
epochs = 20
batch_size = 4
learning_rate = 0.001
weight_decay = 0.0001
optimizer = "adamw"
early_stopping_patience = 0
pipeline_backend = "cuda"

[matrix.counts]
deep_per_seed = 5
total_seed_runs = 15
