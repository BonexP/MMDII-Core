[experiment]
release_directory = "../../../data/interim/releases/weld-independent-v0-2-1-r2"
output_directory = "outputs/time-frequency-v0-3-0"
target_codes = ["flash", "blur", "tunnel"]
mode = "window_mil"
aggregator = "mean"
seed = 7
fold_count = 5
fold_scheme = "weld_independent"
epochs = 20
batch_size = 4
learning_rate = 0.001
weight_decay = 0.0001
optimizer = "adamw"
early_stopping_patience = 0
early_stopping_min_delta = 0.0
gradient_clip_norm = 0.0
device = "auto"
pipeline_backend = "cuda"
target_fs = 5400.0
window_seconds = 2.0
stride_seconds = 1.0
full_signal_samples = 4096

[model]
hidden_channels = 32
embedding_dim = 64
kernel_size = 31
block_count = 2
dropout = 0.1
top_k = 3
attention_dim = 64
encoder_chunk_size = 32

[matrix]
version = "v0.3.0"

# The v0.3.0 deep-learning matrix contains only the three dual branches
# selected from the v0.2.1 exploration: raw + STFT, raw + CWT, and raw + DWT/SWT.
feature_fusions = ["raw_plus_stft", "raw_plus_cwt", "raw_plus_dwt"]
representations = ["stft_256", "cwt_morl", "dwt_swt_db4"]
encoders = ["cnn2d", "resnet2d_small", "convnext2d_lite"]
aggregators = ["mean", "gated_attention"]

# Controls use the same weld-independent release and fold protocol.
controls = ["statistical", "random_forest", "extra_trees"]
seeds = [7, 17, 27]
fold_scheme = "weld_independent"
fold_count = 5
epochs = 20
batch_size = 4
learning_rate = 0.001
weight_decay = 0.0001
optimizer = "adamw"
early_stopping_patience = 0

[matrix.fusion_representation]
raw_plus_stft = "stft_256"
raw_plus_cwt = "cwt_morl"
raw_plus_dwt = "dwt_swt_db4"

[matrix.counts]
deep_per_seed = 18
control_per_seed = 3
per_seed = 21
total_seed_runs = 63
